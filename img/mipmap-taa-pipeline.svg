<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc">
  <title id="title">Mipmap 与 TAA 作用在不同阶段</title>
  <desc id="desc">Mipmap 在单帧纹理采样前进行空间预过滤，TAA 在多帧离散采样结果之后做时间累积；两者可以配合，但 TAA 不能保证恢复采样前丢失的高频信息。</desc>
  <defs>
    <pattern id="checker" width="18" height="18" patternUnits="userSpaceOnUse"><rect width="18" height="18" fill="#fff"/><rect width="9" height="9" fill="#1e293b"/><rect x="9" y="9" width="9" height="9" fill="#1e293b"/></pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#64748b"/></marker>
    <style>.t{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.h{font-size:36px;font-weight:700;fill:#0f172a}.sub{font-size:18px;fill:#64748b}.card{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.label{font-size:21px;font-weight:650;fill:#0f172a}.note{font-size:16px;fill:#64748b}.mono{font:600 16px "SFMono-Regular",Consolas,monospace;fill:#334155}.arrow{fill:none;stroke:#64748b;stroke-width:3;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1400" height="780" fill="#f8fafc"/>
  <g class="t">
    <text x="64" y="62" class="h">Mipmap 先控制频率，TAA 再累积剩余误差</text>
    <text x="64" y="96" class="sub">空间预过滤发生在采样之前；时间抗锯齿处理的是已经产生的多帧离散结果</text>

    <rect x="64" y="150" width="590" height="482" rx="18" class="card"/>
    <text x="94" y="194" class="label">单帧：Mipmap 空间预过滤</text>
    <text x="94" y="222" class="note">先移除当前屏幕采样率表达不了的高频</text>
    <rect x="106" y="286" width="150" height="150" rx="10" fill="url(#checker)" stroke="#94a3b8"/>
    <text x="181" y="466" text-anchor="middle" class="note">高频纹理</text>
    <path d="M280 361H362" class="arrow"/>
    <g transform="translate(386 286)"><rect width="104" height="104" rx="9" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/><rect x="21" y="21" width="62" height="62" rx="8" fill="#93c5fd"/><rect x="37" y="37" width="30" height="30" rx="6" fill="#60a5fa"/></g>
    <text x="438" y="422" text-anchor="middle" class="note">选择 Mip Level</text>
    <path d="M510 338H558" class="arrow"/>
    <circle cx="584" cy="338" r="24" fill="#64748b"/>
    <text x="584" y="382" text-anchor="middle" class="note">稳定样本</text>
    <rect x="106" y="514" width="496" height="72" rx="14" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="354" y="544" text-anchor="middle" class="mono">texture → low-pass → sample</text>
    <text x="354" y="568" text-anchor="middle" class="note">目标：让单帧尽量接近 Footprint 积分</text>

    <rect x="746" y="150" width="590" height="482" rx="18" class="card"/>
    <text x="776" y="194" class="label">多帧：TAA 时间累积</text>
    <text x="776" y="222" class="note">Jitter 改变采样位置，再结合运动向量累积历史</text>
    <g transform="translate(790 282)">
      <g><rect width="112" height="112" rx="10" fill="#eff6ff" stroke="#93c5fd"/><circle cx="48" cy="54" r="8" fill="#ef4444"/><text x="56" y="142" text-anchor="middle" class="mono">Frame k</text></g>
      <g transform="translate(140 0)"><rect width="112" height="112" rx="10" fill="#eff6ff" stroke="#93c5fd"/><circle cx="64" cy="44" r="8" fill="#f59e0b"/><text x="56" y="142" text-anchor="middle" class="mono">k + 1</text></g>
      <g transform="translate(280 0)"><rect width="112" height="112" rx="10" fill="#eff6ff" stroke="#93c5fd"/><circle cx="52" cy="68" r="8" fill="#16a34a"/><text x="56" y="142" text-anchor="middle" class="mono">k + 2</text></g>
      <path d="M410 56H454" class="arrow"/>
      <circle cx="482" cy="56" r="28" fill="#94a3b8"/><text x="482" y="106" text-anchor="middle" class="note">历史结果</text>
    </g>
    <rect x="788" y="514" width="506" height="72" rx="14" fill="#fff7ed" stroke="#fdba74"/>
    <text x="1041" y="544" text-anchor="middle" class="mono">Σ wₖ C(uₖ, vₖ)</text>
    <text x="1041" y="568" text-anchor="middle" class="note">能缓解闪烁，但无法保证恢复已丢失的信息</text>

    <path d="M354 650V686H1041V650" fill="none" stroke="#16a34a" stroke-width="3"/>
    <rect x="386" y="680" width="628" height="60" rx="16" fill="#f0fdf4" stroke="#86efac"/>
    <text x="700" y="718" text-anchor="middle" font-size="21" font-weight="650" fill="#166534">正确顺序：先做好单帧纹理预过滤，再用 TAA 提高时间稳定性</text>
  </g>
</svg>
