<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc">
  <title id="title">Nearest、Bilinear 与 Trilinear</title>
  <desc id="desc">Nearest 读取一个 texel，Bilinear 在一个 Mipmap Level 读取四个 texel，Trilinear 在相邻两个 Level 分别双线性采样后继续插值。</desc>
  <defs>
    <pattern id="grid" width="52" height="52" patternUnits="userSpaceOnUse"><rect width="52" height="52" fill="#fff"/><path d="M52 0H0V52" fill="none" stroke="#cbd5e1" stroke-width="1.5"/></pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#64748b"/></marker>
    <style>.t{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.h{font-size:36px;font-weight:700;fill:#0f172a}.sub{font-size:18px;fill:#64748b}.card{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.label{font-size:22px;font-weight:650;fill:#0f172a}.note{font-size:16px;fill:#64748b}.mono{font:600 17px "SFMono-Regular",Consolas,monospace;fill:#334155}.tap{fill:#2563eb;stroke:#fff;stroke-width:3}.uv{fill:#ef4444;stroke:#fff;stroke-width:4}</style>
  </defs>
  <rect width="1400" height="780" fill="#f8fafc"/>
  <g class="t">
    <text x="64" y="62" class="h">三个名字，对应三个不同的插值维度</text>
    <text x="64" y="96" class="sub">先决定 Level，再决定 Level 内部怎样取样；Trilinear 额外让 Level 之间也连续</text>

    <rect x="64" y="154" width="390" height="494" rx="18" class="card"/>
    <text x="94" y="198" class="label">Nearest</text><text x="94" y="226" class="note">选定 Level 内读取最近的 1 个 texel</text>
    <rect x="118" y="274" width="282" height="260" rx="10" fill="url(#grid)" stroke="#94a3b8"/>
    <rect x="222" y="378" width="52" height="52" fill="#bfdbfe" stroke="#2563eb" stroke-width="4"/>
    <circle cx="262" cy="396" r="10" class="uv"/>
    <text x="259" y="577" text-anchor="middle" class="mono">1 texel tap</text>
    <text x="259" y="608" text-anchor="middle" class="note">最快，但位置变化时会跳变</text>

    <rect x="505" y="154" width="390" height="494" rx="18" class="card"/>
    <text x="535" y="198" class="label">Bilinear</text><text x="535" y="226" class="note">同一个 Level 内对 2×2 texel 加权</text>
    <rect x="559" y="274" width="282" height="260" rx="10" fill="url(#grid)" stroke="#94a3b8"/>
    <rect x="663" y="378" width="104" height="104" fill="#dbeafe" fill-opacity=".7" stroke="#2563eb" stroke-width="3"/>
    <g class="tap"><circle cx="663" cy="378" r="8"/><circle cx="767" cy="378" r="8"/><circle cx="663" cy="482" r="8"/><circle cx="767" cy="482" r="8"/></g>
    <circle cx="720" cy="420" r="10" class="uv"/>
    <g stroke="#2563eb" stroke-width="2" stroke-dasharray="5 5"><path d="M663 378L720 420"/><path d="M767 378L720 420"/><path d="M663 482L720 420"/><path d="M767 482L720 420"/></g>
    <text x="700" y="577" text-anchor="middle" class="mono">4 texel taps</text>
    <text x="700" y="608" text-anchor="middle" class="note">解决一层内部的连续重建</text>

    <rect x="946" y="154" width="390" height="494" rx="18" class="card"/>
    <text x="976" y="198" class="label">Trilinear</text><text x="976" y="226" class="note">两个相邻 Level 各做一次 Bilinear</text>
    <g transform="translate(986 272)">
      <rect x="0" y="0" width="144" height="144" rx="10" fill="url(#grid)" stroke="#94a3b8"/>
      <rect x="44" y="44" width="52" height="52" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
      <text x="72" y="174" text-anchor="middle" class="mono">Level 3</text>
      <rect x="190" y="0" width="144" height="144" rx="10" fill="#dbeafe" stroke="#94a3b8"/>
      <path d="M190 72H334M262 0V144" stroke="#93c5fd" stroke-width="2"/>
      <text x="262" y="174" text-anchor="middle" class="mono">Level 4</text>
      <path d="M98 198C128 232 184 232 214 198" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
      <text x="167" y="246" text-anchor="middle" class="mono">lerp(..., 0.4)</text>
    </g>
    <text x="1141" y="577" text-anchor="middle" class="mono">4 + 4 = 8 taps</text>
    <text x="1141" y="608" text-anchor="middle" class="note">消除 Mipmap Level 的明显分界</text>

    <text x="700" y="714" text-anchor="middle" font-size="22" font-weight="650" fill="#1e40af">Trilinear 让采样连续，但 Footprint 仍被当作各向同性区域</text>
  </g>
</svg>
