<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Unity URP MRT rendering flow</title>
  <desc id="desc">The camera color enters one fullscreen MRT draw, which writes red, green and blue channels to three render targets before a debug pass displays them in four quadrants.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#172033"/>
    </linearGradient>
    <linearGradient id="source" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="pass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#94a3b8"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".28"/>
    </filter>
  </defs>

  <rect width="1200" height="640" rx="26" fill="url(#background)"/>

  <text x="60" y="64" fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="700">Unity URP RenderGraph · MRT Demo</text>
  <text x="60" y="96" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="16">One fullscreen draw writes three color attachments</text>

  <g filter="url(#shadow)">
    <rect x="60" y="168" width="210" height="118" rx="18" fill="url(#source)"/>
    <text x="165" y="216" text-anchor="middle" fill="#fff" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700">Camera Color</text>
    <text x="165" y="247" text-anchor="middle" fill="#dbeafe" font-family="ui-monospace, SFMono-Regular, monospace" font-size="15">activeColorTexture</text>
  </g>

  <path d="M270 227 H355" fill="none" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="370" y="154" width="280" height="146" rx="18" fill="url(#pass)"/>
    <text x="510" y="202" text-anchor="middle" fill="#fff" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="700">Write MRT Raster Pass</text>
    <text x="510" y="236" text-anchor="middle" fill="#cffafe" font-family="Inter, system-ui, sans-serif" font-size="16">Fullscreen triangle · 1 Draw Call</text>
    <text x="510" y="268" text-anchor="middle" fill="#a5f3fc" font-family="ui-monospace, SFMono-Regular, monospace" font-size="14">MrtFragment()</text>
  </g>

  <path d="M650 198 C694 198 694 160 730 160" fill="none" stroke="#f87171" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M650 227 H730" fill="none" stroke="#4ade80" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M650 256 C694 256 694 294 730 294" fill="none" stroke="#60a5fa" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="746" y="122" width="250" height="76" rx="14" fill="#3b1d2a" stroke="#f87171" stroke-width="2"/>
    <circle cx="777" cy="160" r="11" fill="#ef4444"/>
    <text x="801" y="153" fill="#fecaca" font-family="ui-monospace, SFMono-Regular, monospace" font-size="16" font-weight="700">SV_Target0</text>
    <text x="801" y="177" fill="#fca5a5" font-family="ui-monospace, SFMono-Regular, monospace" font-size="14">(R, 0, 0, 1)</text>

    <rect x="746" y="213" width="250" height="76" rx="14" fill="#163124" stroke="#4ade80" stroke-width="2"/>
    <circle cx="777" cy="251" r="11" fill="#22c55e"/>
    <text x="801" y="244" fill="#bbf7d0" font-family="ui-monospace, SFMono-Regular, monospace" font-size="16" font-weight="700">SV_Target1</text>
    <text x="801" y="268" fill="#86efac" font-family="ui-monospace, SFMono-Regular, monospace" font-size="14">(0, G, 0, 1)</text>

    <rect x="746" y="304" width="250" height="76" rx="14" fill="#172d4f" stroke="#60a5fa" stroke-width="2"/>
    <circle cx="777" cy="342" r="11" fill="#3b82f6"/>
    <text x="801" y="335" fill="#bfdbfe" font-family="ui-monospace, SFMono-Regular, monospace" font-size="16" font-weight="700">SV_Target2</text>
    <text x="801" y="359" fill="#93c5fd" font-family="ui-monospace, SFMono-Regular, monospace" font-size="14">(0, 0, B, 1)</text>
  </g>

  <path d="M996 160 C1055 160 1062 324 1062 410" fill="none" stroke="#f87171" stroke-width="2.5"/>
  <path d="M996 251 C1035 251 1041 347 1041 410" fill="none" stroke="#4ade80" stroke-width="2.5"/>
  <path d="M996 342 C1017 342 1021 379 1021 410" fill="none" stroke="#60a5fa" stroke-width="2.5"/>

  <text x="60" y="450" fill="#e2e8f0" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700">Debug View</text>
  <path d="M270 493 H355" fill="none" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="60" y="472" width="210" height="52" rx="13" fill="#243047" stroke="#475569"/>
  <text x="165" y="504" text-anchor="middle" fill="#cbd5e1" font-family="Inter, system-ui, sans-serif" font-size="15">Read MRT 0 / 1 / 2</text>

  <g filter="url(#shadow)">
    <rect x="370" y="418" width="626" height="164" rx="18" fill="#0b1220" stroke="#475569" stroke-width="2"/>
    <line x1="683" y1="418" x2="683" y2="582" stroke="#f8fafc" stroke-width="3"/>
    <line x1="370" y1="500" x2="996" y2="500" stroke="#f8fafc" stroke-width="3"/>

    <rect x="372" y="420" width="309" height="78" rx="15" fill="#17311f"/>
    <text x="527" y="455" text-anchor="middle" fill="#86efac" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700">Green channel</text>
    <text x="527" y="480" text-anchor="middle" fill="#bbf7d0" font-family="ui-monospace, SFMono-Regular, monospace" font-size="14">MRT 1</text>

    <rect x="685" y="420" width="309" height="78" rx="15" fill="#172d4f"/>
    <text x="840" y="455" text-anchor="middle" fill="#93c5fd" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700">Blue channel</text>
    <text x="840" y="480" text-anchor="middle" fill="#bfdbfe" font-family="ui-monospace, SFMono-Regular, monospace" font-size="14">MRT 2</text>

    <rect x="372" y="502" width="309" height="78" rx="15" fill="#252c3d"/>
    <text x="527" y="537" text-anchor="middle" fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700">Reconstructed source</text>
    <text x="527" y="562" text-anchor="middle" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, monospace" font-size="14">MRT 0 + MRT 1 + MRT 2</text>

    <rect x="685" y="502" width="309" height="78" rx="15" fill="#3b1d2a"/>
    <text x="840" y="537" text-anchor="middle" fill="#fca5a5" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700">Red channel</text>
    <text x="840" y="562" text-anchor="middle" fill="#fecaca" font-family="ui-monospace, SFMono-Regular, monospace" font-size="14">MRT 0</text>
  </g>

  <path d="M1042 410 L1042 394 L986 394" fill="none" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
</svg>
