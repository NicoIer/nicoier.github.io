<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc">
  <title id="title">Mipmap Chain 的生成与查询</title>
  <desc id="desc">Level 0 经过低通滤波和二倍降采样生成逐级缩小的纹理，每一级代表更大的基础纹理区域。</desc>
  <defs>
    <pattern id="p0" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fff"/><rect width="12" height="12" fill="#1e3a8a"/><rect x="12" y="12" width="12" height="12" fill="#1e3a8a"/></pattern>
    <pattern id="p1" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#dbeafe"/><rect width="12" height="12" fill="#60a5fa"/><rect x="12" y="12" width="12" height="12" fill="#60a5fa"/></pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#64748b"/></marker>
    <style>.t{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.h{font-size:36px;font-weight:700;fill:#0f172a}.sub{font-size:18px;fill:#64748b}.label{font-size:20px;font-weight:650;fill:#0f172a}.note{font-size:16px;fill:#64748b}.mono{font:600 16px "SFMono-Regular",Consolas,monospace;fill:#1e40af}.frame{stroke:#94a3b8;stroke-width:2}.arrow{fill:none;stroke:#64748b;stroke-width:3;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1400" height="780" fill="#f8fafc"/>
  <g class="t">
    <text x="64" y="62" class="h">Mipmap Chain：预先保存不同尺度的过滤结果</text>
    <text x="64" y="96" class="sub">每一级先低通，再把宽高各缩小一半；Level 越高，一个 texel 汇总的原图区域越大</text>

    <g transform="translate(74 170)">
      <rect width="330" height="330" rx="12" fill="url(#p0)" class="frame"/>
      <rect x="82" y="82" width="166" height="166" fill="#fef3c7" fill-opacity=".72" stroke="#f59e0b" stroke-width="4"/>
      <text x="0" y="370" class="label">Level 0 · 4096²</text>
      <text x="0" y="398" class="note">每个 texel 代表 1×1</text>
    </g>

    <path d="M430 335H520" class="arrow"/><text x="449" y="308" class="note">低通 + 2×</text>
    <g transform="translate(548 220)">
      <rect width="230" height="230" rx="12" fill="url(#p1)" class="frame"/>
      <text x="0" y="270" class="label">Level 1 · 2048²</text>
      <text x="0" y="298" class="note">每个 texel 代表 2×2</text>
    </g>

    <path d="M804 335H882" class="arrow"/><text x="817" y="308" class="note">继续过滤</text>
    <g transform="translate(910 270)">
      <rect width="150" height="150" rx="12" fill="#93c5fd" class="frame"/>
      <path d="M0 75H150M75 0V150" stroke="#bfdbfe" stroke-width="2"/>
      <text x="0" y="190" class="label">Level 2 · 1024²</text>
      <text x="0" y="218" class="note">每个 texel 代表 4×4</text>
    </g>

    <path d="M1086 335H1152" class="arrow"/>
    <g transform="translate(1180 310)">
      <rect width="72" height="72" rx="10" fill="#3b82f6" class="frame"/>
      <text x="0" y="112" class="label">… Level 9</text>
      <text x="0" y="140" class="note">代表 512×512</text>
    </g>

    <rect x="186" y="625" width="1028" height="84" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="700" y="662" text-anchor="middle" font-size="22" font-weight="650" fill="#1e3a8a">运行时不再遍历原图中的整片 texel</text>
    <text x="700" y="691" text-anchor="middle" class="mono">选择与 footprint 尺度最接近的 Level，再做常数级纹理采样</text>
  </g>
</svg>
