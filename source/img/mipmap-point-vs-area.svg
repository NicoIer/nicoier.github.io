<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc">
  <title id="title">点查询与区域查询</title>
  <desc id="desc">对比中心点采样、正确的 footprint 区域积分，以及用大量子采样逼近积分的做法。</desc>
  <defs>
    <pattern id="checker" width="28" height="28" patternUnits="userSpaceOnUse">
      <rect width="28" height="28" fill="#fff"/><rect width="14" height="14" fill="#334155"/><rect x="14" y="14" width="14" height="14" fill="#334155"/>
    </pattern>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r="3" fill="#2563eb"/></pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#64748b"/></marker>
    <style>.t{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.h{font-size:36px;font-weight:700;fill:#0f172a}.sub{font-size:18px;fill:#64748b}.card{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.label{font-size:22px;font-weight:650;fill:#0f172a}.note{font-size:16px;fill:#64748b}.bad{fill:#fef2f2;stroke:#fca5a5}.good{fill:#f0fdf4;stroke:#86efac}.cost{fill:#fff7ed;stroke:#fdba74}.formula{font:600 18px "SFMono-Regular",Consolas,monospace;fill:#334155}</style>
  </defs>
  <rect width="1400" height="780" fill="#f8fafc"/>
  <g class="t">
    <text x="64" y="62" class="h">正确的问题不是“这个点是什么颜色”</text>
    <text x="64" y="96" class="sub">而是“这个像素覆盖的纹理区域，平均以后是什么颜色”</text>

    <rect x="64" y="150" width="390" height="510" rx="18" class="card"/>
    <text x="94" y="194" class="label">Point Query</text><text x="94" y="224" class="note">只看中心附近的 2×2 texel</text>
    <rect x="116" y="268" width="286" height="238" rx="10" fill="url(#checker)" stroke="#94a3b8"/>
    <path d="M168 450L230 310L354 340L306 478Z" fill="#fee2e2" fill-opacity=".25" stroke="#ef4444" stroke-width="4" stroke-dasharray="8 7"/>
    <circle cx="264" cy="392" r="11" fill="#ef4444" stroke="#fff" stroke-width="4"/>
    <rect x="98" y="548" width="322" height="72" rx="14" class="bad"/>
    <text x="259" y="578" text-anchor="middle" font-size="18" font-weight="650" fill="#991b1b">局部样本 ≠ 整片区域</text>
    <text x="259" y="602" text-anchor="middle" class="note">容易产生混叠和摩尔纹</text>

    <rect x="505" y="150" width="390" height="510" rx="18" class="card"/>
    <text x="535" y="194" class="label">Area Query</text><text x="535" y="224" class="note">按 footprint 覆盖面积积分</text>
    <rect x="557" y="268" width="286" height="238" rx="10" fill="url(#checker)" stroke="#94a3b8"/>
    <path d="M609 450L671 310L795 340L747 478Z" fill="#86efac" fill-opacity=".64" stroke="#16a34a" stroke-width="4"/>
    <path d="M700 512V541" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="539" y="556" width="322" height="64" rx="14" class="good"/>
    <text x="700" y="584" text-anchor="middle" font-size="18" font-weight="650" fill="#166534">得到稳定的区域平均值</text>
    <text x="700" y="606" text-anchor="middle" class="formula">C = (1/A) ∫ C(u,v) dudv</text>

    <rect x="946" y="150" width="390" height="510" rx="18" class="card"/>
    <text x="976" y="194" class="label">Supersampling</text><text x="976" y="224" class="note">用大量子采样逼近同一个积分</text>
    <rect x="998" y="268" width="286" height="238" rx="10" fill="url(#checker)" stroke="#94a3b8"/>
    <path d="M1050 450L1112 310L1236 340L1188 478Z" fill="url(#dots)" stroke="#2563eb" stroke-width="4"/>
    <rect x="980" y="548" width="322" height="72" rx="14" class="cost"/>
    <text x="1141" y="578" text-anchor="middle" font-size="18" font-weight="650" fill="#9a3412">结果可行，运行时成本过高</text>
    <text x="1141" y="603" text-anchor="middle" class="formula">512² = 262144 samples</text>

    <text x="700" y="724" text-anchor="middle" font-size="22" font-weight="650" fill="#1e40af">Mipmap 的做法：把 Area Query 的常用尺度提前算好</text>
  </g>
</svg>
